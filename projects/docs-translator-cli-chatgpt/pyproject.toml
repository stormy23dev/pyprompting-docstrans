[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "docs-translator-cli"
version = "0.1.0"
description = "CLI tool for translating documentation files using a REST translation API, SQLite history, and a local glossary."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [
  { name = "Student" }
]
dependencies = [
  "typer>=0.24,<1.0",
  "rich>=14,<16",
  "httpx>=0.27,<1.0",
  "platformdirs>=4,<5",
  "typing-extensions>=4.15,<5"
]

[project.scripts]
docstrans = "docstrans.cli:app"

[dependency-groups]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "respx>=0.21,<1.0",
  "ruff>=0.8,<1.0"
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=docstrans --cov-report=term-missing"

[tool.hatch.build.targets.wheel]
packages = ["src/docstrans"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/README.md",
  "/LICENSE",
  "/.env.example",
  "/.python-version",
  "/pyproject.toml",
]
