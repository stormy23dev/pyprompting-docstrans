[project]
name = "docs-translator-cli"
version = "0.1.0"
description = "CLI tool for translating documentation files using a REST translation API, SQLite history, and a local glossary."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "Student" }]
dependencies = [
    "typer>=0.12,<1.0",
    "rich>=13,<15",
    "httpx>=0.27,<1.0",
    "platformdirs>=4,<5",
]

[project.scripts]
docstrans = "docstrans.cli:app"

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pytest-cov>=5,<8",
    "respx>=0.21,<1.0",
    "ruff>=0.4,<1.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=docstrans --cov-report=term-missing"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docstrans"]
